[project]
name = "vhs-broadcast"
version = "0.1.0"
description = "Retro broadcast-deck VHS effect studio with recordable, deterministic control automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "av>=11.0",
    "mss>=9.0",
    "pygetwindow>=0.0.9",
    "moderngl>=5.6",
    "pyvirtualcam>=0.11",
]

[project.scripts]
vhs-broadcast = "vhs_broadcast.app:main"
vhs-render = "vhs_broadcast.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhs_broadcast"]
artifacts = ["src/vhs_broadcast/assets/**/*"]

[tool.uv]
# uv reads this file directly; `uv run vhs-broadcast` resolves the script above.
