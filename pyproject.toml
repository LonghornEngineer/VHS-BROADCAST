[project]
name = "vhs-broadcast"
version = "0.3.0"
description = "Retro broadcast-deck VHS effect studio with manual keyframes and audio-reactive controls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "av>=11.0",
    "mss>=9.0",
    "pygetwindow>=0.0.9",
    "pyvirtualcam>=0.11",
]

[project.optional-dependencies]
# Agent-facing MCP server (vhs-mcp); the app and vhs-agent CLI do not need it.
# mcp 2 renamed FastMCP to MCPServer; the server uses the v2 API.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
vhs-broadcast = "vhs_broadcast.app:main"
vhs-render = "vhs_broadcast.render:main"
vhs-agent = "vhs_broadcast.api:main"
vhs-mcp = "vhs_broadcast.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhs_broadcast"]
artifacts = ["src/vhs_broadcast/assets/fonts/VT323-Regular.ttf", "src/vhs_broadcast/assets/fonts/ShareTechMono-Regular.ttf", "src/vhs_broadcast/assets/fonts/PressStart2P-Regular.ttf", "src/vhs_broadcast/assets/fonts/*.txt"]

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc", "src/vhs_broadcast/assets/fonts/VCR*.ttf"]

[tool.uv]
# uv reads this file directly; `uv run vhs-broadcast` resolves the script above.
